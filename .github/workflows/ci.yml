name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Ruff
        run: ruff check src tests benchmark scripts
      - name: Pytest
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build --tag enterprise-healthcare-data-platform:test .
      - name: Run tests in image
        run: docker run --rm enterprise-healthcare-data-platform:test

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run reproducible Spark benchmark
        run: >-
          python benchmark/spark_healthcare_benchmark.py
          --rows 10000
          --partitions 2
      - name: Run readmission cohort validation
        run: >-
          python scripts/run_readmission_validation.py
          --rows 5000
          --min-cohort-rows 50
      - name: Publish benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: healthcare-spark-benchmark
          path: |
            artifacts/healthcare-spark-benchmark/metrics.json
            artifacts/healthcare-spark-benchmark/report.md
            artifacts/readmission-validation/readmission_metrics.json
            artifacts/readmission-validation/readmission_cohorts.csv
            artifacts/readmission-validation/readmission_cohorts.md
